<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>FitBuddy</title>
	<style>
		:root { color-scheme: light; font-family: Georgia, "Times New Roman", serif; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f2f5ef; color: #18352c; }
		main { width: min(680px, calc(100% - 48px)); padding: 48px 0; }
		.mark { color: #56836c; font: 700 13px/1.2 system-ui, sans-serif; letter-spacing: 0.12em; text-transform: uppercase; }
		h1 { margin: 18px 0 12px; font-size: clamp(42px, 8vw, 72px); line-height: 0.98; font-weight: 500; }
		p { max-width: 460px; color: #52675d; font: 17px/1.6 system-ui, sans-serif; }
		a { display: inline-block; margin-top: 18px; padding: 12px 18px; border-radius: 4px; background: #245640; color: white; text-decoration: none; font: 600 14px system-ui, sans-serif; }
		a:hover { background: #183c2c; }
	</style>
</head>
<body>
	<main>
		<div class="mark">FitBuddy</div>
		<h1>Your training starts here.</h1>
		<p>The FitBuddy server is running. Open the API documentation to explore the available endpoints.</p>
		<a href="/docs">Open API docs</a>
	</main>
</body>
</html>
